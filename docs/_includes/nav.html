<script>
  document.addEventListener("click", function (e) {
    var menu = document.querySelector(".brand-menu");
    var trigger = document.querySelector(".brand-trigger");
    if (menu && menu.classList.contains("brand-open") && !menu.contains(e.target) && e.target !== trigger) {
      menu.classList.remove("brand-open");
    }
  });
</script>
